name: wireguard-interno

services:
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Chile/Continental
      - SERVERPORT=51820 #optional
      - PEERS=5 #optional
      - PEERDNS=172.20.0.7 #optional
      - INTERNAL_SUBNET=10.14.14.0
      - SERVERURL=192.168.1.4 #optional
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules
      - /usr/src:/usr/src
      - wg-peers:/peers
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    dns:
      - 172.20.0.7
    restart: unless-stopped
    networks:
      containers:
        ipv4_address: 172.20.0.6

  pihole:
    container_name: pihole
    image: pihole/pihole
    ports:
      - 8082:80
    expose:
      - "53"
      - "67"
      - "80"
      - "443"
    environment:
      TZ: 'Chile/Continental'
      WEBPASSWORD: '1507Bramirezj'
    volumes:
      - './etc-pihole/:/etc/pihole/'
      - './etc-dnsmasq.d/:/etc/dnsmasq.d/'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      containers:
        ipv4_address: 172.20.0.7


  # === Portal web Caddy ===
  caddy:
    image: caddy:2-alpine
    container_name: wg-onboarding
    restart: unless-stopped
    ports:
      - "${ONBOARDING_PORT:-8081}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./onboarding:/srv/onboarding:ro
      - wg-peers:/peers:ro

networks:
  containers:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  wg-peers:
    driver: local
